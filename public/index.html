 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3zm4.6 12.6c-.2.6-1.2 1.1-1.7 1.1-.4.1-1 .1-1.6-.1-3-1-4.9-4-5-4.2-.2-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.2.3-.1.5.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.4.3.2.5.1.6 0l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/></svg>'
};
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c);
const money = (n) => Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (t) => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : t === "err" ? tg.HapticFeedback.notificationOccurred("error") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
let toastT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.className = "toast show"; clearTimeout(toastT); toastT = setTimeout(() => (t.className = "toast"), 2400); };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const openLink = (u) => { if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); };

const S = { data: null, stack: [], cart: store.get("medellin_cart", []), q: "", form: store.get("medellin_form", {}), country: store.get("medellin_country", null) };
const ctry = () => (S.data && S.data.countries.find((c) => c.code === S.country)) || null;
// «≈ 110 сом» рядом с ценой в тенге — для покупателей не из Казахстана
const alt = (kzt) => { const c = ctry(); if (!c || c.cur === "KZT" || !c.rate) return ""; const v = kzt / c.rate; return `≈ ${money(c.cur === "UZS" ? Math.round(v / 100) * 100 : v)} ${c.sym}`; };
const byId = (id) => S.data.products.find((p) => p.id === id);
const sec = (k) => S.data.sections.find((s) => s.key === k);
const catTitle = (k) => { for (const s of S.data.sections) for (const c of s.categories) if (c.key === k) return c.title; return ""; };
const cartCount = () => S.cart.reduce((a, i) => a + i.qty, 0);
const saveCart = () => { S.cart = S.cart.filter((i) => byId(i.id)); store.set("medellin_cart", S.cart); };

/* ---------- навигация ---------- */
function go(name, params = {}, replace = false) {
  if (replace) S.stack[S.stack.length - 1] = { name, params }; else S.stack.push({ name, params });
  render(); window.scrollTo(0, 0);
}
function back() { if (S.stack.length > 1) { S.stack.pop(); render(); window.scrollTo(0, 0); } }
function tab(name) { S.stack = [{ name: "home", params: {} }]; if (name !== "home") S.stack.push({ name, params: {} }); render(); window.scrollTo(0, 0); }
if (tg) tg.BackButton.onClick(back);

function render() {
  const cur = S.stack[S.stack.length - 1];
  if (tg) S.stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  app.innerHTML = VIEWS[cur.name](cur.params);
  const tabFor = { home: "home", section: "cat", catalog: "cat", cart: "cart", profile: "profile" }[cur.name];
  $("#nav").innerHTML = ["product", "cart", "done", "country"].includes(cur.name) ? "" : tabs(tabFor);
  bind(cur);
}

const tabs = (on) => `<nav class="tabs">${[["home", "Главная", I.home], ["cat", "Каталог", I.grid], ["cart", "Корзина", I.cart], ["profile", "Профиль", I.user]]
  .map(([k, l, s]) => `<button class="tab ${on === k ? "on" : ""}" data-tab="${k}">${s}${l}${k === "cart" && cartCount() ? `<span class="badge">${cartCount()}</span>` : ""}</button>`).join("")}</nav>`;

const card = (p) => `<button class="card" data-p="${p.id}"><div class="img" style="background-image:url('${p.photos[0]}')">${p.hasVideo ? '<span class="play">▶</span>' : ""}${!p.inStock ? '<span class="tag out">Нет в наличии</span>' : p.isNew ? '<span class="tag">Новинка</span>' : ""}</div>
  <div class="b"><div class="n">${esc(p.name)}</div><div class="p">${money(p.price)} ₸ / ${p.unit.label}</div>${alt(p.price) ? `<div class="alt">${alt(p.price)}</div>` : ""}<div class="q">упаковка ${p.pack} ${plural(p.pack, ...p.unit.forms)}</div></div>${p.inStock ? `<span class="add" data-add="${p.id}" role="button" aria-label="В корзину">+</span>` : ""}</button>`;

const emptyCatalog = () => `<div class="empty"><b>Каталог наполняется</b>Скоро здесь появятся товары. А пока — пишите нам в WhatsApp.</div>`;

/* ---------- экраны ---------- */
const VIEWS = {

      return head + `<div class="toolbar"><span>Найдено: ${res.length}</span></div>` + (res.length ? `<div class="grid">${res.map(card).join("")}</div>` : `<div class="empty"><b>Ничего не нашли</b>Попробуйте другое слово: «пижама», «майка», «детские»</div>`);

    return `<div class="gallery"><div class="track" id="track">${p.media.map((m) => m.type === "video" ? `<video src="${m.src}" ${m.poster ? `poster="${m.poster}"` : ""} playsinline controls preload="metadata"></video>` : `<div style="background-image:url('${m.src}')"></div>`).join("")}</div>
      <div class="nav"><button class="icon-btn" data-back aria-label="Назад">${I.back}</button><button class="icon-btn" data-share aria-label="Поделиться">${I.share}</button></div>

      ${p.sizes.length ? `<div class="lbl">Размер${p.sizes.length > 1 ? " — выберите" : ""}</div><div class="sizes">${p.sizes.map((z) => `<button class="size ${size === z ? "on" : ""}" data-psize="${esc(z)}">${esc(z)}</button>`).join("")}</div>` : ""}
      ${p.colors.length ? `<div class="lbl">Цвета</div><div class="colors">${p.colors.map((c) => `<i style="background:${esc(c.hex)}" title="${esc(c.name)}"></i>`).join("")}</div>` : ""}
      <div class="info glass">${info.map(([a, b]) => `<div><span>${a}</span><span>${esc(b)}</span></div>`).join("")}</div>

      <div class="bar">${p.inStock ? `<div class="stepper"><button data-pq="-1" aria-label="Меньше">−</button><b>${qty}</b><button data-pq="1" aria-label="Больше">+</button></div>
        <button class="btn" data-buy="${p.id}">${I.cart}В корзину · ${money(p.price * p.pack * qty)} ₸</button>`
        : `<button class="btn ghost" data-wa="Здравствуйте! Когда будет в наличии: ${esc(p.name)}?">${I.wa}Спросить о наличии</button>`}</div>`;
  },
  cart() {
    if (!S.cart.length) return `<div class="back"><button class="icon-btn glass" data-back aria-label="Назад">${I.back}</button><h1>Корзина</h1></div>
      <div class="empty"><b>Корзина пуста</b>Добавьте товары из каталога</div><button class="btn" data-tab="cat" style="width:100%">Перейти в каталог</button>`;
    const total = S.cart.reduce((a, i) => { const p = byId(i.id); return a + (p ? p.price * p.pack * i.qty : 0); }, 0);
    const f = S.form;
    return `<div class="back" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><button class="icon-btn glass" data-back aria-label="Назад">${I.back}</button><h1>Корзина</h1></div><button class="chip" id="clearcart">Очистить</button></div>
      ${S.cart.map((i, k) => { const p = byId(i.id); return `<div class="citem glass"><div class="img" style="background-image:url('${p.photos[0]}')"></div>
        <div class="m"><b>${esc(p.name)}</b><small>${i.size ? esc(i.size) + " · " : ""}${p.pack} ${plural(p.pack, ...p.unit.forms)} в упаковке · ${money(p.price)} ₸/${p.unit.label}</small><span class="s">${money(p.price * p.pack * i.qty)} ₸</span></div>
        <div class="stepper"><button data-cq="${k}:-1" aria-label="Меньше">−</button><b>${i.qty}</b><button data-cq="${k}:1" aria-label="Больше">+</button></div></div>`; }).join("")}
      <div class="total"><div><small>Итого · ${cartCount()} упак.</small><b>${money(total)} ₸</b>${alt(total) ? `<div class="alt" style="font-size:14px">${alt(total)}</div>` : ""}</div></div>
      ${total < S.data.shop.minOrder ? `<div class="minbar">Минимальная сумма заказа — <b>${money(S.data.shop.minOrder)} ₸</b>. Добавьте ещё на <b class="gold">${money(S.data.shop.minOrder - total)} ₸</b>
        <div class="track"><i style="width:${Math.min(100, total / S.data.shop.minOrder * 100)}%"></i></div></div>` : ""}
      <div class="lbl">Данные для заказа</div>
      <input class="field" id="f_name" placeholder="Имя" value="${esc(f.name || (tg && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : ""))}" autocomplete="name">

      <div class="bar">${total < S.data.shop.minOrder ? `<button class="btn" data-tab="cat">Добавить товары · ещё ${money(S.data.shop.minOrder - total)} ₸</button>` : `<button class="btn" id="order">Оформить заказ · ${money(total)} ₸</button>`}</div>`;
  },

      <p>Заказ №${esc(id)} на ${money(total)} ₸.<br>Мы напишем вам в WhatsApp в ближайшее время.</p>
      <div style="width:100%;display:grid;gap:10px;margin-top:10px"><button class="btn" data-wa="${esc(wa || `Здравствуйте! Я оформил(а) заказ №${id} в каталоге Medellin.`)}">${I.wa}Отправить заказ в WhatsApp</button>

      <div class="lbl">Как мы работаем</div>
      <div class="info glass"><div><span>Минимальный заказ</span><span>от ${money(S.data.shop.minOrder)} ₸</span></div><div><span>Доставка</span><span>Казахстан и СНГ</span></div><div><span>Оплата</span><span>после подтверждения в WhatsApp</span></div></div>
      <div class="lbl">Связь</div>

/* ---------- обработчики ---------- */
function addToCart(id, qty = 1, size = "") {
  const p = byId(id); if (!p) return;
  if (!size && p.sizes.length === 1) size = p.sizes[0];
  const ex = S.cart.find((i) => i.id === id && i.size === size);
  if (ex) ex.qty += qty; else S.cart.push({ id, size, qty });
  saveCart(); haptic("ok"); toast(`Добавлено: ${p.name}`);
}
function bind(cur) {
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { haptic(); tab(b.dataset.tab === "cat" ? "catalog" : b.dataset.tab); }));
  $("#nav").querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { haptic(); tab(b.dataset.tab === "cat" ? "catalog" : b.dataset.tab); }));
  app.querySelectorAll("[data-back]").forEach((b) => (b.onclick = back));
  app.querySelectorAll("[data-p]").forEach((b) => (b.onclick = (e) => {
    if (e.target.closest("[data-add]")) { e.stopPropagation(); return addToCart(e.target.closest("[data-add]").dataset.add); }
    haptic(); S.pqty = 1; go("product", { id: b.dataset.p });
  }));
  app.querySelectorAll("[data-sec]").forEach((b) => (b.onclick = () => { haptic(); go("section", { key: b.dataset.sec, cat: b.dataset.cat || "" }); }));
  app.querySelectorAll("[data-wa]").forEach((b) => (b.onclick = () => openLink(`https://wa.me/${S.data.shop.whatsapp}?text=${encodeURIComponent(b.dataset.wa)}`)));
  app.querySelectorAll("[data-link]").forEach((b) => (b.onclick = () => openLink(b.dataset.link)));
  app.querySelectorAll("[data-country]").forEach((b) => (b.onclick = () => {
    haptic("ok"); S.country = b.dataset.country; store.set("medellin_country", S.country);
    const c = ctry(); if (c) { S.form = { ...S.form, phone: S.form.phone && S.form.phone.replace(/\D/g, "").length > 4 ? S.form.phone : c.phone, country: c.name }; store.set("medellin_form", { ...S.form, comment: "" }); }
    if (S.stack.length > 1) back(); else { S.stack = [{ name: "home", params: {} }]; render(); }
  }));
  const cc = $("#clearcart");
  if (cc) cc.onclick = () => { const go2 = (ok) => { if (!ok) return; S.cart = []; saveCart(); haptic("ok"); render(); }; if (tg && tg.showConfirm) tg.showConfirm("Очистить корзину?", go2); else go2(confirm("Очистить корзину?")); };
  if ($("#myorders") && tg && tg.initData) loadMyOrders();
  app.querySelectorAll("[data-go-country]").forEach((b) => (b.onclick = () => { haptic(); go("country"); }));
  const q = $("#q");
  if (q) {
    q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  }
  if (cur.name === "section") {
    app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { haptic(); go("section", { ...cur.params, cat: b.dataset.cat, size: "" }, true); }));
    app.querySelectorAll("[data-size]").forEach((b) => (b.onclick = () => { haptic(); go("section", { ...cur.params, size: cur.params.size === b.dataset.size ? "" : b.dataset.size }, true); }));
  }
  if (cur.name === "product") {
    const p = byId(cur.params.id); if (!p) return;
    const tr = $("#track");
    if (tr) tr.onscroll = () => { const i = Math.round(tr.scrollLeft / tr.clientWidth); app.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === i)); tr.querySelectorAll("video").forEach((v) => { if (tr.children[i] !== v) v.pause(); }); };
    app.querySelectorAll("[data-psize]").forEach((b) => (b.onclick = () => { haptic(); go("product", { ...cur.params, size: b.dataset.psize }, true); }));
    app.querySelectorAll("[data-pq]").forEach((b) => (b.onclick = () => { haptic(); S.pqty = Math.max(1, (S.pqty || 1) + +b.dataset.pq); go("product", cur.params, true); }));
    const share = app.querySelector("[data-share]");
    if (share) share.onclick = () => openLink(`https://t.me/share/url?url=${encodeURIComponent(location.origin)}&text=${encodeURIComponent(`${p.name} — ${money(p.price)} ₸/шт · Medellin`)}`);
    const buy = app.querySelector("[data-buy]");
    if (buy) buy.onclick = () => {
      if (p.sizes.length > 1 && !cur.params.size) { haptic("err"); return toast("Выберите размер"); }
      addToCart(p.id, S.pqty || 1, cur.params.size || ""); S.pqty = 1; back();
    };
  }
  if (cur.name === "cart") {
    app.querySelectorAll("[data-cq]").forEach((b) => (b.onclick = () => {
      const [k, d] = b.dataset.cq.split(":").map(Number); haptic();
      S.cart[k].qty += d; if (S.cart[k].qty <= 0) S.cart.splice(k, 1); saveCart(); keepForm(); render();
    }));
    app.querySelectorAll(".field").forEach((f) => (f.oninput = keepForm));
    const ob = $("#order"); if (ob) ob.onclick = submit;
  }
}
function keepForm() {
  const v = (id) => ($("#" + id) ? $("#" + id).value : undefined);
  if (!$("#f_name")) return;
  S.form = { name: v("f_name"), phone: v("f_phone"), city: v("f_city"), country: v("f_country"), comment: v("f_comment") };
  store.set("medellin_form", { ...S.form, comment: "" });
}
async function submit() {
  keepForm();
  const f = S.form;
  if (!f.name.trim()) return (haptic("err"), toast("Укажите имя"));
  if (f.phone.replace(/\D/g, "").length < 10) return (haptic("err"), toast("Укажите телефон"));
  if (!f.city.trim()) return (haptic("err"), toast("Укажите город"));
  const b = $("#order"); b.disabled = true; b.textContent = "Отправляем…";
  try {
    const r = await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...f, items: S.cart, buyerCountry: S.country, initData: tg ? tg.initData : "" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Не получилось отправить, попробуйте ещё раз");
    S.cart = []; saveCart(); haptic("ok");
    S.stack = [{ name: "home", params: {} }, { name: "done", params: { id: d.id, total: d.total, wa: d.waText } }]; render(); window.scrollTo(0, 0);
  } catch (e) {
    haptic("err"); toast(e.message); b.disabled = false; b.textContent = "Оформить заказ";
    if (/закончил|убран|наличии/.test(e.message)) load();
  }
}

async function loadMyOrders() {
  const box = $("#myorders"); if (!box) return;
  try {
    const r = await fetch("/api/my-orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) });
    const d = await r.json();
    if (!$("#myorders")) return;
    box.innerHTML = d.items.length ? d.items.map((o) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)">
      <div><b style="font-weight:600">№${esc(o.id)} · ${money(o.total)} ₸</b><div class="muted" style="font-size:13px;margin-top:2px">${new Date(o.date).toLocaleDateString("ru-RU")} · ${esc(o.statusText)}</div></div>
      ${o.canCancel ? `<button class="chip" data-cancel="${esc(o.id)}" style="color:var(--rose)">Отменить</button>` : ""}</div>`).join("")
      : `<div class="muted" style="padding:14px 0;font-size:14px">Заказов пока нет</div>`;
    box.querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = () => {
      const doIt = async (ok) => { if (!ok) return;
        const r2 = await fetch("/api/orders/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.cancel, initData: tg.initData }) });
        const d2 = await r2.json().catch(() => ({}));
        if (r2.ok) { haptic("ok"); toast("Заказ отменён"); } else { haptic("err"); toast(d2.error || "Не получилось"); }
        loadMyOrders(); };
      if (tg && tg.showConfirm) tg.showConfirm(`Отменить заказ №${b.dataset.cancel}?`, doIt); else doIt(confirm("Отменить заказ?"));
    }));
  } catch (e) { box.innerHTML = `<div class="muted" style="padding:14px 0;font-size:14px">Не удалось загрузить заказы</div>`; }
}

async function load() {
  try {
    const r = await fetch("/api/catalog", { cache: "no-store" });
    S.data = await r.json();
    saveCart();
    if (!S.stack.length) S.stack = [{ name: S.country ? "home" : "country", params: {} }];
    // ?p=<id> — открыть товар по ссылке
    const pid = new URLSearchParams(location.search).get("p") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
    if (pid && byId(pid) && S.stack.length === 1) S.stack.push({ name: "product", params: { id: pid } });
    render();
  } catch (e) {
    app.innerHTML = `<div class="empty"><b>Нет связи</b>Проверьте интернет и откройте каталог ещё раз</div>`;
  }
}
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#160507"); tg.setBackgroundColor("#160507"); tg.setBottomBarColor && tg.setBottomBarColor("#160507"); } catch (e) {} }
load();
</script></body></html>
