<style>

:root{--bg:#160507;--wine:#3B0D14;--gold:#D9B26F;--cream:#F5EBDD;--cream2:#C9B8A6;--rose:#E8707A;--line:rgba(245,235,221,.1);--r:22px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--cream);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(110px + var(--safe-b));background:radial-gradient(120% 50% at 50% -5%,#4A0E18 0%,transparent 60%),radial-gradient(70% 35% at 100% 40%,rgba(217,178,111,.07),transparent 70%),var(--bg);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.glass{background:linear-gradient(160deg,rgba(245,235,221,.07),rgba(245,235,221,.02));box-shadow:inset 0 0 0 1px rgba(245,235,221,.1),inset 0 1px 0 rgba(245,235,221,.1),0 10px 30px rgba(0,0,0,.4);border-radius:var(--r);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.satin{background:radial-gradient(120% 80% at 20% 10%,rgba(255,180,190,.22),transparent 45%),radial-gradient(90% 70% at 85% 80%,rgba(120,20,35,.9),transparent 60%),linear-gradient(125deg,#5A0F1A 0%,#8A2234 30%,#4A0C16 55%,#7A1C2C 75%,#3B0D14 100%)}
.gold{color:var(--gold)} .muted{color:var(--cream2)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,178,111,.5),0 6px 18px rgba(0,0,0,.5)}
.top .t{flex:1;min-width:0}.top .t b{font-family:Playfair,Georgia,serif;font-size:26px;color:var(--rose);display:block;line-height:1}
.top .t small{font-size:10.5px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.icon-btn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#2A0A0F;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.back{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back h1{font-family:Playfair,Georgia,serif;font-size:26px;line-height:1.1}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;margin-bottom:14px;color:var(--cream2)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--cream)}
.search input::placeholder{color:#9C887C}
.search .mic{flex:none;width:38px;height:38px;margin-right:-8px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:rgba(217,178,111,.12)}

.search .mic.rec{background:var(--rose);color:#fff;animation:pulse 1.1s infinite}

.rechint{margin:-6px 4px 14px;font-size:13.5px;color:var(--rose);text-align:center}
.aibtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin:0 0 14px;border-radius:16px;font-weight:600;font-size:14.5px;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(217,178,111,.45);background:rgba(217,178,111,.08)}
.aibox{padding:16px;margin-bottom:16px;border-radius:var(--r);background:linear-gradient(135deg,rgba(217,178,111,.16),rgba(90,15,26,.3));box-shadow:inset 0 0 0 1px rgba(217,178,111,.35)}
.aibox .q{font-size:13px;color:var(--cream2);margin-bottom:6px}.aibox .a{font-size:15.5px;line-height:1.4}
.aibox .x{margin-top:10px;font-size:13px;color:var(--gold)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite;display:inline-block;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1.2em}}
.banner{position:relative;overflow:hidden;padding:20px;margin-bottom:22px;border-radius:var(--r);box-shadow:inset 0 0 0 1px rgba(217,178,111,.35),0 14px 34px rgba(0,0,0,.5)}
.banner b{font-family:Playfair,Georgia,serif;font-size:27px;display:block;line-height:1.15;position:relative}

.banner .pill{display:inline-block;margin-top:14px;padding:9px 15px;border-radius:20px;background:var(--gold);color:#2A0A0F;font-weight:700;font-size:13px;position:relative}
.banner img{position:absolute;right:-24px;bottom:-26px;width:148px;border-radius:50%;opacity:.95}
h2{font-family:Playfair,Georgia,serif;font-size:22px;margin:4px 2px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 button{font-family:Inter;font-size:14px;color:var(--gold);font-weight:500}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.sec{position:relative;height:150px;border-radius:var(--r);overflow:hidden;text-align:left;box-shadow:inset 0 0 0 1px rgba(217,178,111,.3),0 10px 26px rgba(0,0,0,.45)}
.sec:first-child{grid-column:1/3;height:172px}
.sec .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.sec::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,5,7,0) 30%,rgba(22,5,7,.9) 100%)}
.sat-men{background:radial-gradient(120% 80% at 20% 10%,rgba(170,205,255,.28),transparent 45%),radial-gradient(90% 70% at 85% 80%,rgba(10,30,80,.9),transparent 60%),linear-gradient(125deg,#123270 0%,#2C62B8 32%,#14367A 58%,#2452A0 78%,#0C2252 100%)}
.sat-kids{background:radial-gradient(120% 80% at 20% 10%,rgba(255,255,240,.7),transparent 45%),radial-gradient(90% 70% at 85% 80%,rgba(230,195,110,.6),transparent 60%),linear-gradient(125deg,#F8EBB8 0%,#FFF6D2 32%,#EED892 58%,#FBEDBE 78%,#E6CC82 100%)}
.sec-women .ph{background-position:78% 25%}.sec-men .ph{background-position:62% 15%}.sec-kids .ph{background-position:62% 20%}
.sec-men::after{background:linear-gradient(180deg,rgba(12,34,82,0) 45%,rgba(12,34,82,.92) 100%)!important}
.sec-kids::after{background:linear-gradient(180deg,rgba(248,235,184,0) 50%,rgba(246,228,170,.95) 100%)!important}
.sec-men{box-shadow:inset 0 0 0 1px rgba(140,180,255,.45),0 10px 26px rgba(0,0,0,.45)}
.sec-men::after{background:linear-gradient(180deg,rgba(12,34,82,0) 30%,rgba(12,34,82,.92) 100%)}
.sec-men small{color:#A9C8FF}
.sec-kids{box-shadow:inset 0 0 0 1px rgba(255,230,160,.6),0 10px 26px rgba(0,0,0,.45)}
.sec-kids::after{background:linear-gradient(180deg,rgba(248,235,184,0) 30%,rgba(246,228,170,.95) 100%)}
.sec-kids span{color:#3E2B08}.sec-kids small{color:#8A6418}
.alt{font-size:12px;color:var(--cream2);margin-top:1px}
.cpick{min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.cpick img{width:84px;margin:0 auto 6px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,178,111,.5)}
.cpick h1{font-family:Playfair,Georgia,serif;font-size:30px}.cpick p{color:var(--cream2);margin:-4px 0 10px;line-height:1.5}
.cbtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;text-align:left;font-size:18px;font-weight:500}
.cbtn .f{font-size:30px;line-height:1}.cbtn small{margin-left:auto;color:var(--cream2);font-size:14px}
.cbtn.sug{box-shadow:inset 0 0 0 1.5px var(--gold),0 10px 30px rgba(0,0,0,.4)}
.minbar{padding:14px 16px;margin:-6px 0 18px;border-radius:16px;background:rgba(217,178,111,.1);box-shadow:inset 0 0 0 1px rgba(217,178,111,.35);font-size:14px;color:var(--cream)}
.minbar .track{height:6px;border-radius:3px;background:rgba(245,235,221,.1);margin-top:10px;overflow:hidden}
.minbar .track i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#B98E48,#F0D49A)}
.card .play{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(22,5,7,.6);display:grid;place-items:center;color:#fff;font-size:12px}
.sec span{position:absolute;left:16px;bottom:14px;z-index:1;font-family:Playfair,Georgia,serif;font-size:24px}
.sec small{position:absolute;right:14px;bottom:18px;z-index:1;font-size:12px;color:var(--gold)}
.sec:not(:first-child) span{bottom:32px;font-size:22px}.sec:not(:first-child) small{left:16px;right:auto;bottom:12px}
.hrow{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.hrow .card{flex:0 0 152px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:var(--r);overflow:hidden;text-align:left;background:linear-gradient(160deg,rgba(245,235,221,.06),rgba(245,235,221,.02));box-shadow:inset 0 0 0 1px rgba(245,235,221,.1);position:relative;display:block;width:100%}
.card .img{aspect-ratio:3/4;background:#2A0A0F center/cover;position:relative}
.card .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--rose);color:#fff}

.card .tag.sale{background:#E5484D}
.card .old,.prices s{color:var(--cream2);font-weight:500;text-decoration:line-through}
.card .old{font-size:12.5px;margin-top:6px}.card .old+.p{margin-top:0}
.prices s{font-size:17px}
.prices .disc{font-size:13px;font-weight:800;color:#fff;background:#E5484D;padding:3px 8px;border-radius:8px}
.salebn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;margin:4px 0 6px;border-radius:var(--r);text-align:left;color:#fff;background:linear-gradient(120deg,#B4232C,#E5484D 60%,#F08A4B);box-shadow:0 12px 30px rgba(229,72,77,.3)}
.salebn .ic{font-size:30px}.salebn b{display:block;font-size:19px}.salebn small{font-size:13px;opacity:.9}.salebn i{margin-left:auto;font-style:normal;font-size:22px}
.card .tag.out{background:rgba(22,5,7,.75);color:var(--cream2)}
.card .b{padding:10px 12px 12px}
.card .n{font-size:14px;font-weight:500;line-height:1.25;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .p{font-weight:700;font-size:16px;margin-top:6px;color:var(--gold)}
.card .q{font-size:12px;color:var(--cream2);margin-top:2px}
.card .add{position:absolute;right:10px;bottom:12px;width:34px;height:34px;border-radius:12px;background:var(--gold);color:#2A0A0F;font-size:22px;font-weight:600;display:grid;place-items:center;box-shadow:0 4px 14px rgba(217,178,111,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;font-size:14px;font-weight:500;color:var(--cream2);background:rgba(245,235,221,.06);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip.on{background:var(--gold);color:#2A0A0F;box-shadow:none;font-weight:600}
.chip small{opacity:.6;margin-left:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--cream2);gap:10px}
.sizes-f{gap:6px;margin-top:-4px}
.sizes-f button{flex:none;height:32px;min-width:38px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--cream2);box-shadow:inset 0 0 0 1px var(--line)}
.sizes-f button.on{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);background:rgba(217,178,111,.12)}
.empty{padding:40px 20px;text-align:center;color:var(--cream2);line-height:1.5}
.empty b{display:block;font-family:Playfair,Georgia,serif;font-size:22px;color:var(--cream);margin-bottom:6px}
.gallery{position:relative;margin:-16px -16px 0;aspect-ratio:4/5;overflow:hidden;background:#2A0A0F}
.gallery .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .track>*{flex:0 0 100%;height:100%;scroll-snap-align:start}
.gallery .track div{background:center/cover}
.gallery .track video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.gallery::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,transparent,var(--bg));pointer-events:none}
.gallery .nav{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.gallery .nav .icon-btn{background:rgba(22,5,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);pointer-events:auto}
.dots{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(245,235,221,.4);transition:width .2s}.dots i.on{width:20px;background:var(--gold)}
.pname{font-family:Playfair,Georgia,serif;font-size:28px;line-height:1.15;margin-top:4px}
.prices{display:flex;align-items:baseline;gap:10px;margin:10px 0 16px}
.prices b{font-size:30px;color:var(--gold)} .prices span{color:var(--cream2);font-size:14px}
.pack{padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:inset 0 0 0 1px rgba(217,178,111,.35)}
.pack small{color:var(--cream2);font-size:13px;display:block}.pack b{font-size:20px}
.lbl{font-size:12px;color:var(--cream2);margin:0 2px 8px;letter-spacing:.08em;text-transform:uppercase}
.sizes{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.size{min-width:58px;padding:0 12px;height:46px;border-radius:14px;font-weight:600;background:rgba(245,235,221,.06);box-shadow:inset 0 0 0 1px var(--line)}
.size.on{background:rgba(217,178,111,.15);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.colors{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.colors i{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(245,235,221,.25)}
.info{padding:4px 16px;margin-bottom:16px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.info div:last-child{border:0}.info div span:first-child{color:var(--cream2);flex:none}.info div span:last-child{text-align:right}
.desc{color:var(--cream2);font-size:14px;line-height:1.6;white-space:pre-line;margin:0 2px 16px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));max-width:496px;margin:0 auto;display:flex;gap:10px;padding:10px;z-index:6;border-radius:24px;background:rgba(40,10,16,.85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(245,235,221,.1),0 12px 34px rgba(0,0,0,.6)}
.stepper{display:flex;align-items:center;border-radius:16px;background:rgba(245,235,221,.07);box-shadow:inset 0 0 0 1px var(--line);flex:none}

.btn{flex:1;height:52px;border-radius:16px;font-weight:700;font-size:16px;color:#2A0A0F;background:linear-gradient(160deg,#F0D49A,#D9B26F 50%,#B98E48);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px rgba(217,178,111,.3);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45}
.btn.ghost{background:none;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(245,235,221,.25)}
.citem{display:flex;gap:12px;padding:10px;margin-bottom:10px;align-items:center}

.citem .m{flex:1;min-width:0}.citem .m b{font-size:15px;font-weight:500;display:block;line-height:1.25}
.citem .m small{color:var(--cream2);font-size:12px;display:block;margin:3px 0 6px}
.citem .m .s{font-weight:700;color:var(--gold)}
.citem .stepper button{width:32px;height:38px;font-size:18px}.citem .stepper b{min-width:20px;font-size:15px}
.total{padding:18px;margin:14px 0 20px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(217,178,111,.18),rgba(90,15,26,.3));box-shadow:inset 0 0 0 1px rgba(217,178,111,.45),0 10px 28px rgba(0,0,0,.4)}
.total small{color:var(--cream2);font-size:13px;display:block}.total b{font-size:30px;color:var(--gold)}
.field{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(245,235,221,.05);font-size:16px;padding:0 16px;margin-bottom:10px;outline:none}
.field:focus{border-color:rgba(217,178,111,.6)}
textarea.field{height:80px;padding:14px 16px;resize:none}
.field::placeholder{color:#8E7A70}
.done{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.check{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(217,178,111,.2),rgba(217,178,111,0) 70%);box-shadow:inset 0 0 0 2px var(--gold),0 0 50px rgba(217,178,111,.25);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.check svg{width:56px;height:56px;color:var(--gold);stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}} @keyframes draw{to{stroke-dashoffset:0}}
.done h1{font-family:Playfair,Georgia,serif;font-size:34px}
.done p{color:var(--cream2);line-height:1.5;max-width:300px}
.links{padding:4px 16px;margin-bottom:14px}
.links a,.links button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);color:var(--cream);text-decoration:none;font-size:16px;text-align:left}

.tabs{position:fixed;left:12px;right:12px;bottom:calc(14px + var(--safe-b));max-width:496px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;z-index:5;border-radius:24px;background:rgba(40,10,16,.8);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(245,235,221,.1),0 12px 34px rgba(0,0,0,.6)}

.pcolors{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}.pcolors::-webkit-scrollbar{display:none}

.trust .fl i:last-child{margin-right:0}.trust b{display:block;font-size:15px;font-weight:600}.trust small{display:block;font-size:13px;color:var(--cream2);margin-top:2px}

.top3 .md{font-size:22px}.top3 .fg{font-size:20px}.top3 b{flex:1;font-weight:600;font-size:16px}.top3 .ct{color:var(--gold);font-size:14px;font-weight:600}

.editb{display:block;margin:2px 0 8px;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(184,137,62,.14);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(184,137,62,.4)}

.crow .csw{flex:none;width:34px;height:34px;border-radius:50%;margin:0 6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.12)}

</style></head><body>
<div class="wrap" id="app"><div class="skel"></div></div>
<div id="nav"></div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const $ = (s) => document.querySelector(s);
const app = $("#app");
const I = {
 cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v7h14v-7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3zm4.6 12.6c-.2.6-1.2 1.1-1.7 1.1-.4.1-1 .1-1.6-.1-3-1-4.9-4-5-4.2-.2-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.2.3-.1.5.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.4.3.2.5.1.6 0l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/></svg>'
};
// «Нам доверяют…» + топ-3 покупателей месяца
const MEDAL = ["🥇", "🥈", "🥉"];
const topHTML = () => { const t = S.top; if (!t) return "";
  const trust = t.countries.length ? `<div class="trust glass"><div class="fl">${t.countries.map((c) => `<i title="${esc(c.name)}">${c.flag}</i>`).join("")}</div><div><b>Нам доверяют покупатели</b><small>из ${t.countries.map((c) => c.name.replace(/стан$/, "стана").replace(/^Россия$/, "России")).join(", ").replace(/, ([^,]*)$/, " и $1")}</small></div></div>` : "";
  const top = t.top.length ? `<div class="top3 glass"><div class="th">🏆 Топ покупателей ${esc(t.month)}</div>${t.top.map((r, k) => `<div class="tr"><span class="md">${MEDAL[k]}</span><span class="fg">${r.flag}</span><b>${esc(r.name)}</b><span class="ct">${r.count} ${plural(r.count, "заказ", "заказа", "заказов")}</span></div>`).join("")}</div>` : "";
  return trust + top; };
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c);
const money = (n) => Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (t) => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : t === "err" ? tg.HapticFeedback.notificationOccurred("error") : tg.HapticFeedback.impactOccurred("medium"); } catch (e) {} };
let toastT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.className = "toast show"; clearTimeout(toastT); toastT = setTimeout(() => (t.className = "toast"), 2400); };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const openLink = (u) => { if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); };

const S = { data: null, stack: [], cart: store.get("medellin_cart", []), q: "", ai: null, mic: false, form: store.get("medellin_form", {}), country: store.get("medellin_country", null) };
const ctry = () => (S.data && S.data.countries.find((c) => c.code === S.country)) || null;
// «≈ 110 сом» рядом с ценой в тенге — для покупателей не из Казахстана
const alt = (kzt) => { const c = ctry(); if (!c || c.cur === "KZT" || !c.rate) return ""; const v = kzt / c.rate; return `≈ ${money(c.cur === "UZS" ? Math.round(v / 100) * 100 : v)} ${c.sym}`; };
const byId = (id) => S.data.products.find((p) => p.id === id);
const sec = (k) => S.data.sections.find((s) => s.key === k);
const catTitle = (k) => { for (const s of S.data.sections) for (const c of s.categories) if (c.key === k) return c.title; return ""; };
const cc = (i) => (Number.isInteger(i.c) ? i.c : -1); // расцветка позиции (-1 — не выбрана)
const cartCount = () => S.cart.reduce((a, i) => a + i.qty, 0);
const saveCart = () => { S.cart = S.cart.filter((i) => byId(i.id)); store.set("medellin_cart", S.cart); };

/* ---------- навигация ---------- */
function go(name, params = {}, replace = false) { if (name === "product" && params.id && !replace) ev("view", params.id);
  if (replace) S.stack[S.stack.length - 1] = { name, params }; else S.stack.push({ name, params });
  render(); window.scrollTo(0, 0);
}
function back() { if (S.stack.length > 1) { S.stack.pop(); render(); window.scrollTo(0, 0); } }
function tab(name) { S.stack = [{ name: "home", params: {} }]; if (name !== "home") S.stack.push({ name, params: {} }); render(); window.scrollTo(0, 0); }
if (tg) tg.BackButton.onClick(back);

function render() {
  const cur = S.stack[S.stack.length - 1];
  if (tg) S.stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  app.innerHTML = VIEWS[cur.name](cur.params);
  const tabFor = { home: "home", section: "cat", sale: "cat", catalog: "cat", cart: "cart", profile: "profile" }[cur.name];
  $("#nav").innerHTML = ["product", "cart", "done", "country"].includes(cur.name) ? "" : tabs(tabFor);
  bind(cur);
}

const tabs = (on) => `<nav class="tabs">${[["home", "Главная", I.home], ["cat", "Каталог", I.grid], ["cart", "Корзина", I.cart], ["profile", "Профиль", I.user]]
  .map(([k, l, s]) => `<button class="tab ${on === k ? "on" : ""}" data-tab="${k}">${s}${l}${k === "cart" && cartCount() ? `<span class="badge">${cartCount()}</span>` : ""}</button>`).join("")}</nav>`;

const card = (p) => `<button class="card" data-p="${p.id}"><div class="img" style="background-image:url('${p.photos[0]}')">${p.hasVideo ? '<span class="play">▶</span>' : ""}${!p.inStock ? '<span class="tag out">Нет в наличии</span>' : p.sale ? `<span class="tag sale">−${p.sale}%</span>` : p.isNew ? '<span class="tag">Новинка</span>' : ""}</div>
  <div class="b"><div class="n">${esc(p.name)}</div>${p.oldPrice ? `<div class="old">${money(p.oldPrice)} ₸</div>` : ""}<div class="p">${money(p.price)} ₸ / ${p.unit.label}</div>${alt(p.price) ? `<div class="alt">${alt(p.price)}</div>` : ""}<div class="q">упаковка ${p.pack} ${plural(p.pack, ...p.unit.forms)}</div></div>${p.inStock ? `<span class="add" data-add="${p.id}" role="button" aria-label="В корзину">+</span>` : ""}</button>`;

const emptyCatalog = () => `<div class="empty"><b>Каталог наполняется</b>Скоро здесь появятся товары. А пока — пишите нам в WhatsApp.</div>`;

const saleItems = () => S.data.products.filter((p) => p.sale && p.inStock).sort((a, b) => b.sale - a.sale);
const saleBanner = () => { const s = saleItems(); return s.length ? `<button class="salebn" data-sale><span class="ic">🔥</span><span><b>Распродажа</b><small>${s.length} ${plural(s.length, "товар", "товара", "товаров")} · скидки до −${s[0].sale}%</small></span><i>→</i></button>` : ""; };

/* ---------- экраны ---------- */
const VIEWS = {
  home() {
    const d = S.data, q = S.q.trim().toLowerCase();
    const head = `<div class="top"><img src="img/logo.png" alt="Medellin"><div class="t"><b>Medellin</b><small>Стиль · качество · доверие</small></div>
      <button class="icon-btn glass" data-tab="cart" aria-label="Корзина">${I.cart}${cartCount() ? `<span class="badge">${cartCount()}</span>` : ""}</button></div>
      <label class="search glass">${I.search}<input id="q" type="search" placeholder="${S.mic ? "Говорите…" : "Поиск или нажмите 🎤"}" value="${esc(S.q)}" autocomplete="off"><button type="button" class="mic ${S.mic ? "rec" : ""}" id="mic" aria-label="Голосовой поиск">${I.mic}</button></label>
      ${S.mic ? `<div class="rechint">Говорите, что ищете… нажмите 🎤 ещё раз, чтобы отправить</div>` : ""}`;
    if (S.ai) {
      const a = S.ai, items = (a.ids || []).map(byId).filter(Boolean);
      return head + `<div class="aibox">${a.query ? `<div class="q">${a.voice ? "🎤" : "✨"} «${esc(a.query)}»</div>` : ""}<div class="a ${a.loading ? "dots" : ""}">${a.loading ? "Подбираю товары" : esc(a.reply || (items.length ? "Вот что подобрала 👇" : "Пока не нашла подходящего 🙈 Попробуйте сказать иначе"))}</div>${a.loading ? "" : `<button class="x" id="aiclear">✕ Сбросить подбор</button>`}</div>`
        + (items.length ? `<div class="grid">${items.map(card).join("")}</div>` : "");
    }
    if (q) {
      const words = q.split(/\s+/);
      const res = d.products.filter((p) => words.every((w) => (p.name + " " + catTitle(p.category) + " " + (sec(p.section) || {}).title).toLowerCase().replace(/ё/g, "е").includes(w.replace(/ё/g, "е"))));
      return head + `<button class="aibtn" id="aiask">✨ Подобрать с ассистентом</button><div class="toolbar"><span>Найдено: ${res.length}</span></div>` + (res.length ? `<div class="grid">${res.map(card).join("")}</div>` : `<div class="empty"><b>Ничего не нашли</b>Попробуйте другое слово: «пижама», «майка», «детские»</div>`);
    }
    const news = d.products.filter((p) => p.inStock).slice(0, 10);
    return head + `
      <div class="banner satin"><b>Заказ от ${money(d.shop.minOrder)} ₸</b><p>Опт · доставка по Казахстану и СНГ</p><button class="pill" data-tab="cat">Смотреть каталог</button><img src="img/logo.png" alt=""></div>
      ${saleBanner()}
      <h2>Разделы</h2>
      <div class="sections">${d.sections.map((s) => `<button class="sec sec-${s.key}" data-sec="${s.key}"><div class="ph" style="background-image:url('img/sec-${s.key}.jpg')"></div><span>${s.title}</span><small>${s.count ? s.count + " " + plural(s.count, "товар", "товара", "товаров") + " →" : "скоро"}</small></button>`).join("")}</div>
      <div id="topbox">${topHTML()}</div>
      ${news.length ? `<h2>Новинки <button data-tab="cat">Все →</button></h2><div class="hrow">${news.map(card).join("")}</div>` : emptyCatalog()}`;
  },
  edit({ id }) {
    const e = S.edit;
    if (!e || e.id !== id) return `<div class="back"><button class="icon-btn glass" data-back aria-label="Назад">${I.back}</button><h1>Редактировать</h1></div><div class="empty"><b>Загружаю…</b></div>`;
    const f = e.f, opt = (v, t, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${esc(t)}</option>`;
    const cats = S.data.sections.map((s) => `<optgroup label="${esc(s.title)}">${s.categories.map((c) => opt(c.key, c.title, f.category)).join("")}</optgroup>`).join("");
    const seg = (v, t) => `<button class="${f.colorMode === v ? "on" : ""}" data-cm="${v}">${t}</button>`;
    return `<div class="back"><button class="icon-btn glass" data-back aria-label="Назад">${I.back}</button><h1>Редактировать</h1></div>
      <div class="ef glass">
        <label>Название<input id="e_name" value="${esc(f.name)}"></label>
        <div class="two"><label>Цена ${esc(f.unit.per)}, ₸<input id="e_price" inputmode="numeric" value="${f.price || ""}"></label><label>В упаковке, ${esc(f.unit.forms[2])}<input id="e_pack" inputmode="numeric" value="${f.pack || ""}"></label></div>
        <label>Цена со скидкой, ₸ <small>пусто — без скидки</small><input id="e_sale" inputmode="numeric" value="${f.sale || ""}"></label>
        <label>Категория<select id="e_cat">${opt("", "— без категории —", f.category)}${cats}</select></label>
        <label>Производство <small>пусто — не показывать</small><input id="e_country" value="${esc(f.country)}" placeholder="Турция, Китай…"></label>
      </div>
      <div class="lbl">Расцветки</div>
      <div class="seg">${seg("pick", "По фото")}${seg("names", "Названиями")}${seg("mix", "Без выбора")}</div>
      ${f.colorMode === "pick" ? `<div class="ehint">Отметьте фото, которые — <b>отдельные цвета</b>. Общие фото и повторы не отмечайте.</div>
        <div class="ephotos">${f.photos.map((ph, i) => { const n = f.colorPhotos.indexOf(i); return `<button class="eph ${n >= 0 ? "on" : ""}" data-eph="${i}" style="background-image:url('${ph}')">${n >= 0 ? `<b>№${n + 1}</b>` : ""}</button>`; }).join("")}</div>`
      : f.colorMode === "names" ? `<div class="ehint">Когда все цвета на одном фото. Напишите через запятую:</div><input class="ein" id="e_names" value="${esc(f.colorNames.join(", "))}" placeholder="чёрный, розовый, голубой, красный, белый">`
      : `<div class="ehint">Клиент просто выбирает количество упаковок — для «один цвет в пачке» без вариантов или «микс цветов».</div>`}

const EVQ = [];
const ev = (k, p, q, n) => { EVQ.push({ k, p, q, n }); if (EVQ.length >= 20) flushEv(); };
function flushEv() {
  if (!EVQ.length) return;
  const body = JSON.stringify({ initData: (tg && tg.initData) || "", events: EVQ.splice(0, 40) });
  try { if (!(navigator.sendBeacon && navigator.sendBeacon("/api/ev", new Blob([body], { type: "application/json" })))) throw 0; }
  catch (e) { fetch("/api/ev", { method: "POST", headers: { "Content-Type": "application/json" }, body, keepalive: true }).catch(() => {}); }
}
setInterval(flushEv, 5000);
document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" && flushEv());
let searchT = null;

// позиция этого товара (с выбранным размером) в корзине
function inCart(p, size, color = -1) {
  const z = size || (p.sizes.length === 1 ? p.sizes[0] : "");
  if (p.sizes.length > 1 && !z) return null;
  if (hasColors(p) && color < 0) return null;
  return S.cart.find((i) => i.id === p.id && i.size === z && cc(i) === color) || null;
}
// сколько упаковок расцветки k (выбранного размера) уже в корзине
// есть ли у товара выбор расцветки (микс — нет; 1-е фото общее — не считается)
const hasColors = (p) => (p.colorOpts || []).length > 1;
const colorOpt = (p, k) => (p.colorOpts || []).find((o) => o.k === k);
const SW = { "чёрн": "#1a1a1a", "черн": "#1a1a1a", "бел": "#fff", "молоч": "#f3ead8", "крас": "#c8202e", "бордо": "#6d1424", "роз": "#f2a7bd", "пудр": "#e8c4bd", "голуб": "#9cc7ee", "син": "#2a4fa0", "беж": "#d9c2a3", "сер": "#9a9a9a", "зел": "#3f8f5a", "олив": "#7b7d3d", "жёлт": "#f1cf45", "желт": "#f1cf45", "корич": "#6b4630", "шоколад": "#5a3a28", "мокко": "#8a6b55", "фиол": "#7a4fa3", "сирен": "#b59ad6", "лаванд": "#c4b5e6", "мят": "#a8e0cc", "персик": "#f7b99a", "корал": "#f27a63", "оранж": "#f08a2c", "капуч": "#b08e70", "лилов": "#9c5ab8", "хаки": "#7a7350", "изумруд": "#1f7a5c" };
const swatch = (name) => { const s = String(name).toLowerCase(); const k = Object.keys(SW).find((x) => s.includes(x)); return k ? SW[k] : "linear-gradient(135deg,#f2a7bd,#9cc7ee,#f1cf45)"; };
const effSize = (p, size) => size || (p.sizes.length === 1 ? p.sizes[0] : "");
colorQty.of = (i) => (Number.isInteger(i.c) ? i.c : -1);
function colorQty(p, size, k) { const z = effSize(p, size); const it = S.cart.find((i) => i.id === p.id && i.size === z && cc(i) === k); return it ? it.qty : 0; }
function addToCart(id, qty = 1, size = "", color = -1) {
  const p = byId(id); if (!p) return;
  if (!size && p.sizes.length === 1) size = p.sizes[0];
  const ex = S.cart.find((i) => i.id === id && i.size === size && cc(i) === color);
  if (ex) ex.qty += qty; else S.cart.push({ id, size, c: color, qty });
  saveCart(); haptic("ok"); toast(`Добавлено: ${p.name}`); ev("cart", id);
}
/* ---------- AI-ассистент: голос и умный подбор ---------- */
let rec = null;
async function micToggle() {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Голос не поддерживается — напишите, что ищете");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return toast("Нет доступа к микрофону — разрешите его для Telegram в настройках телефона"); }
  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  const chunks = [];
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach((t) => t.stop()); clearTimeout(rec._t);
    const blob = new Blob(chunks, { type: rec.mimeType || mime || "audio/webm" });
    S.mic = false; render();
    if (blob.size < 1500) return toast("Слишком коротко — скажите ещё раз");
    aiAsk({ blob });
  };
  rec.start(); S.mic = true; haptic(); S.stack = [{ name: "home", params: {} }]; render(); window.scrollTo(0, 0);
  rec._t = setTimeout(() => rec && rec.state === "recording" && rec.stop(), 15000);
}
async function aiAsk({ blob, text }) {
  S.ai = { loading: true, query: text || "" }; S.q = ""; S.stack = [{ name: "home", params: {} }]; render(); window.scrollTo(0, 0);
  try {
    const r = blob
      ? await fetch("/api/ai/voice", { method: "POST", headers: { "Content-Type": blob.type || "audio/webm", "X-Init-Data": (tg && tg.initData) || "" }, body: blob })
      : await fetch("/api/ai/find", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: text, initData: (tg && tg.initData) || "" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Ассистент сейчас недоступен");
    S.ai = { query: d.query, reply: d.reply, ids: d.ids || [], voice: !!blob }; haptic("ok");
  } catch (e) { S.ai = null; haptic("err"); toast(e.message); }
  render();
}

function bind(cur) {
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { haptic(); tab(b.dataset.tab === "cat" ? "catalog" : b.dataset.tab); }));
  $("#nav").querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { haptic(); tab(b.dataset.tab === "cat" ? "catalog" : b.dataset.tab); }));
  app.querySelectorAll("[data-back]").forEach((b) => (b.onclick = back));
  app.querySelectorAll("[data-sale]").forEach((b) => (b.onclick = () => { haptic(); go("sale"); }));
  app.querySelectorAll("[data-p]").forEach((b) => (b.onclick = (e) => {
    if (e.target.closest("[data-add]")) { e.stopPropagation(); return addToCart(e.target.closest("[data-add]").dataset.add); }
    haptic(); S.pqty = 1; go("product", { id: b.dataset.p });
  }));
  app.querySelectorAll("[data-sec]").forEach((b) => (b.onclick = () => { haptic(); go("section", { key: b.dataset.sec, cat: b.dataset.cat || "" }); }));
  app.querySelectorAll("[data-wa]").forEach((b) => (b.onclick = () => openLink(`https://wa.me/${S.data.shop.whatsapp}?text=${encodeURIComponent(b.dataset.wa)}`)));
  app.querySelectorAll("[data-link]").forEach((b) => (b.onclick = () => openLink(b.dataset.link)));
  app.querySelectorAll("[data-country]").forEach((b) => (b.onclick = () => {
    haptic("ok"); S.country = b.dataset.country; store.set("medellin_country", S.country);
    const c = ctry(); if (c) { S.form = { ...S.form, phone: S.form.phone && S.form.phone.replace(/\D/g, "").length > 4 ? S.form.phone : c.phone, country: c.name }; store.set("medellin_form", { ...S.form, comment: "" }); }
    if (S.stack.length > 1) back(); else { S.stack = [{ name: "home", params: {} }]; render(); }
  }));
  const co = $("#cancelorder");
  if (co) co.onclick = () => {
    const doIt = async (ok) => { if (!ok) return;
      co.disabled = true;
      const r = await fetch("/api/orders/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: co.dataset.id, initData: tg.initData }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) {
        haptic("ok");
        app.innerHTML = `<div class="done"><img src="img/logo.png" style="width:64px;border-radius:50%" alt=""><h1>Заказ отменён</h1><p>Заказ №${esc(co.dataset.id)} отменён. Если передумаете — оформите новый 🤍</p><div style="width:100%;margin-top:10px"><button class="btn" data-tab="home" style="width:100%">Вернуться в каталог</button></div></div>`;
        bind({ name: "done", params: {} });
      } else { haptic("err"); toast(d.error || "Не получилось отменить"); co.disabled = false; }
    };
    if (tg.showConfirm) tg.showConfirm(`Отменить заказ №${co.dataset.id}?`, doIt); else doIt(confirm("Отменить заказ?"));
  };
  const cc = $("#clearcart");
  if (cc) cc.onclick = () => { const go2 = (ok) => { if (!ok) return; S.cart = []; saveCart(); haptic("ok"); render(); }; if (tg && tg.showConfirm) tg.showConfirm("Очистить корзину?", go2); else go2(confirm("Очистить корзину?")); };
  if ($("#myorders") && tg && tg.initData) loadMyOrders();
  const tm = $("#topme");
  if (tm) {
    if (S.topShow === undefined) fetch("/api/top/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) }).then((r) => r.json()).then((d) => { S.topShow = d.show; tm.classList.toggle("on", d.show); }).catch(() => {});
    tm.onclick = () => { haptic(); S.topShow = !tm.classList.contains("on"); tm.classList.toggle("on", S.topShow);
      fetch("/api/top/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData, show: S.topShow }) }).catch(() => {});
      toast(S.topShow ? "Ваше имя будет в топе" : "Вы скрыты из топа"); };
  }
  app.querySelectorAll("[data-go-country]").forEach((b) => (b.onclick = () => { haptic(); go("country"); }));
  const q = $("#q");
  if (q) {
    q.oninput = () => { S.q = q.value; S.ai = null;
      clearTimeout(searchT); searchT = setTimeout(() => { const t = S.q.trim(); if (t.length >= 3) { const n = (document.querySelectorAll("#app .grid [data-p]") || []).length; ev("search", null, t, n); } }, 1500); const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  }
  const mb = $("#mic"); if (mb) mb.onclick = (e) => { e.preventDefault(); micToggle(); };
  const ab = $("#aiask"); if (ab) ab.onclick = () => { haptic(); aiAsk({ text: S.q.trim() }); };
  const ac = $("#aiclear"); if (ac) ac.onclick = () => { haptic(); S.ai = null; render(); };
  if (cur.name === "section") {
    app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { haptic(); go("section", { ...cur.params, cat: b.dataset.cat, size: "" }, true); }));
    app.querySelectorAll("[data-size]").forEach((b) => (b.onclick = () => { haptic(); go("section", { ...cur.params, size: cur.params.size === b.dataset.size ? "" : b.dataset.size }, true); }));
  }
  const eb = app.querySelector("[data-edit]");
  if (eb) eb.onclick = () => openEdit(eb.dataset.edit);
  if (cur.name === "edit" && S.edit && S.edit.id === cur.params.id) bindEdit(cur);
  if (cur.name === "product") {
    const p = byId(cur.params.id); if (!p) return;
    const tr = $("#track");
    if (tr) tr.onscroll = () => { const i = Math.round(tr.scrollLeft / tr.clientWidth); app.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === i)); tr.querySelectorAll("video").forEach((v) => { if (tr.children[i] !== v) v.pause(); }); };
    app.querySelectorAll("[data-psize]").forEach((b) => (b.onclick = () => { haptic(); go("product", { ...cur.params, size: cur.params.size === b.dataset.psize ? "" : b.dataset.psize }, true); }));
    app.querySelectorAll("[data-pq]").forEach((b) => (b.onclick = () => { haptic(); S.pqty = Math.max(1, (S.pqty || 1) + +b.dataset.pq); go("product", cur.params, true); }));
    const share = app.querySelector("[data-share]");
    if (share) share.onclick = () => {
      const link = `${location.origin}/p/${encodeURIComponent(p.id)}`;
      const text = `${p.name}\n${money(p.price)} ₸ ${p.unit.per} · упаковка ${p.pack} ${plural(p.pack, ...p.unit.forms)}\nОпт Medellin 👇`;
      const viaWa = () => { ev("share", p.id, "wa"); openLink(`https://wa.me/?text=${encodeURIComponent(text + "\n" + link)}`); };
      const viaTg = () => { ev("share", p.id, "tg"); const u = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`; if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else openLink(u); };
      haptic();
      if (tg && tg.showPopup) tg.showPopup({ title: "Поделиться товаром", message: "Куда отправить?", buttons: [{ id: "wa", type: "default", text: "WhatsApp" }, { id: "tg", type: "default", text: "Telegram" }, { type: "cancel" }] }, (b) => { if (b === "wa") viaWa(); else if (b === "tg") viaTg(); });
      else viaWa();
    };
    app.querySelectorAll("[data-cshow]").forEach((b) => (b.onclick = () => {
      const k = +b.dataset.cshow, o = colorOpt(p, k), tr = $("#track"), mi = p.media.findIndex((m) => o && m.src === o.photo); haptic();
      if (tr) { tr.scrollTo({ left: tr.clientWidth * (mi >= 0 ? mi : k), behavior: "smooth" }); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }));
    app.querySelectorAll("[data-cstep]").forEach((b) => (b.onclick = () => {
      const [k, d] = b.dataset.cstep.split(":").map(Number), z = effSize(p, cur.params.size);
      if (p.sizes.length > 1 && !z) { haptic("err"); return toast("Сначала выберите размер"); }
      if (!colorOpt(p, k)) return;
      const it = S.cart.find((i) => i.id === p.id && i.size === z && colorQty.of(i) === k);
      if (d > 0) { if (it) it.qty++; else { S.cart.push({ id: p.id, size: z, c: k, qty: 1 }); ev("cart", p.id); } haptic(); }
      else if (it) { it.qty--; if (it.qty <= 0) S.cart.splice(S.cart.indexOf(it), 1); haptic(); } else return;
      saveCart(); const y = window.scrollY, tx = ($("#track") || {}).scrollLeft || 0;
      go("product", { ...cur.params, size: z }, true); window.scrollTo(0, y); const t2 = $("#track"); if (t2) t2.scrollLeft = tx;
    }));
    const need = app.querySelector("[data-cneed]"); if (need) need.onclick = () => { haptic("err"); toast(p.sizes.length > 1 && !cur.params.size ? "Выберите размер и количество" : "Нажмите + у нужных расцветок"); const c = app.querySelector(".crows"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); };
    app.querySelectorAll("[data-pcolor]").forEach((b) => (b.onclick = () => {
      haptic(); const k = +b.dataset.pcolor, y = window.scrollY;
      go("product", { ...cur.params, color: cur.params.color === k ? -1 : k }, true); window.scrollTo(0, y);
      const tr = $("#track"), mi = p.media.findIndex((m) => m.src === p.photos[k]);
      if (tr && cur.params.color !== k) tr.scrollTo({ left: tr.clientWidth * (mi >= 0 ? mi : k), behavior: "smooth" });
    }));
    app.querySelectorAll("[data-incq]").forEach((b) => (b.onclick = () => {
      const it = inCart(p, cur.params.size || "", Number.isInteger(cur.params.color) ? cur.params.color : -1); if (!it) return;
      it.qty += +b.dataset.incq;
      if (it.qty <= 0) { S.cart.splice(S.cart.indexOf(it), 1); haptic("ok"); toast("Убрано из корзины"); } else haptic();
      saveCart(); S.pqty = 1; go("product", cur.params, true);
    }));
    const buy = app.querySelector("[data-buy]");
    if (buy) buy.onclick = () => {
      const col = Number.isInteger(cur.params.color) ? cur.params.color : -1;
      if (hasColors(p) && col < 0) { haptic("err"); const pc = app.querySelector(".pcolors"); if (pc) pc.scrollIntoView({ behavior: "smooth", block: "center" }); return toast("Выберите расцветку"); }
      if (p.sizes.length > 1 && !cur.params.size) { haptic("err"); return toast("Выберите размер"); }
      const z = cur.params.size || (p.sizes.length === 1 ? p.sizes[0] : ""); addToCart(p.id, S.pqty || 1, z, col); S.pqty = 1; go("product", { ...cur.params, size: z }, true);
    };
  }
  if (cur.name === "cart") {
    app.querySelectorAll("[data-cq]").forEach((b) => (b.onclick = () => {
      const [k, d] = b.dataset.cq.split(":").map(Number); haptic();
      S.cart[k].qty += d; if (S.cart[k].qty <= 0) S.cart.splice(k, 1); saveCart(); keepForm(); render();
    }));
    app.querySelectorAll(".field").forEach((f) => (f.oninput = keepForm));
    const ob = $("#order"); if (ob) ob.onclick = submit;
  }
}
function keepForm() {
  const v = (id) => ($("#" + id) ? $("#" + id).value : undefined);
  if (!$("#f_name")) return;
  S.form = { name: v("f_name"), phone: v("f_phone"), city: v("f_city"), country: v("f_country"), comment: v("f_comment") };
  store.set("medellin_form", { ...S.form, comment: "" });
}
async function submit() {
  keepForm();
  const f = S.form;
  if (!f.name.trim()) return (haptic("err"), toast("Укажите имя"));
  if (f.phone.replace(/\D/g, "").length < 10) return (haptic("err"), toast("Укажите телефон"));
  if (!f.city.trim()) return (haptic("err"), toast("Укажите город"));
  const b = $("#order"); b.disabled = true; b.textContent = "Отправляем…";
  try {
    const r = await fetch("/api/orders", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...f, items: S.cart, buyerCountry: S.country, initData: tg ? tg.initData : "" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Не получилось отправить, попробуйте ещё раз");
    S.cart = []; saveCart(); haptic("ok");
    S.stack = [{ name: "home", params: {} }, { name: "done", params: { id: d.id, total: d.total, wa: d.waText } }]; render(); window.scrollTo(0, 0);
    // разрешение боту писать в личку: статусы заказа и новинки
    try { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (u && !u.allows_write_to_pm && tg.requestWriteAccess) tg.requestWriteAccess(() => {}); } catch (e) {}
  } catch (e) {
    haptic("err"); toast(e.message); b.disabled = false; b.textContent = "Оформить заказ";
    if (/закончил|убран|наличии/.test(e.message)) load();
  }
}

// ---------- редактирование товара (админ) ----------
const adminPost = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData, ...body }) }).then((r) => r.json());
async function openEdit(id) {
  S.edit = null; go("edit", { id });
  try { const d = await adminPost("/api/admin/get", { id }); if (d.error) throw 0; S.edit = { id, f: d }; } catch (e) { return toast("Нет доступа"); }
  if (S.stack[S.stack.length - 1].name === "edit") render();
}
function bindEdit(cur) {
  const f = S.edit.f, val = (s) => ($(s) || {}).value;
  const sync = () => { f.name = val("#e_name"); f.price = val("#e_price"); f.pack = val("#e_pack"); f.sale = val("#e_sale"); f.category = val("#e_cat"); f.country = val("#e_country");
    if ($("#e_names")) f.colorNames = val("#e_names").split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean); };
  const rerender = () => { sync(); const y = window.scrollY; render(); window.scrollTo(0, y); };
  app.querySelectorAll("[data-cm]").forEach((b) => (b.onclick = () => { haptic(); f.colorMode = b.dataset.cm; rerender(); }));
  app.querySelectorAll("[data-eph]").forEach((b) => (b.onclick = () => { haptic(); const i = +b.dataset.eph, n = f.colorPhotos.indexOf(i);
    if (n >= 0) f.colorPhotos.splice(n, 1); else f.colorPhotos.push(i); f.colorPhotos.sort((a, b2) => a - b2); rerender(); }));
  app.querySelectorAll("[data-etog]").forEach((b) => (b.onclick = () => { haptic(); f[b.dataset.etog] = !f[b.dataset.etog]; b.classList.toggle("on", f[b.dataset.etog]); }));
  $("#e_save").onclick = async () => {
    sync(); haptic("ok"); $("#e_save").disabled = true;
    try {
      const d = await adminPost("/api/admin/save", { id: cur.params.id, f });
      if (!d.ok) throw 0;
      await load(true); toast("Сохранено ✓"); back();
    } catch (e) { toast("Не удалось сохранить"); $("#e_save").disabled = false; }
  };
  $("#e_del").onclick = () => {
    const del = async () => { try { await adminPost("/api/admin/delete", { id: cur.params.id }); await load(true); toast("Товар удалён"); S.stack = S.stack.filter((s) => !(s.params && s.params.id === cur.params.id)); if (!S.stack.length) S.stack = [{ name: "home", params: {} }]; render(); } catch (e) { toast("Не удалось удалить"); } };
    if (tg && tg.showConfirm) tg.showConfirm("Удалить товар из каталога навсегда?", (ok) => ok && del()); else if (confirm("Удалить товар?")) del();
  };
}
async function loadMyOrders() {
  const box = $("#myorders"); if (!box) return;
  try {
    const r = await fetch("/api/my-orders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) });
    const d = await r.json();
    if (!$("#myorders")) return;
    box.innerHTML = d.items.length ? d.items.map((o) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)">
      <div><b style="font-weight:600">№${esc(o.id)} · ${money(o.total)} ₸</b><div class="muted" style="font-size:13px;margin-top:2px">${new Date(o.date).toLocaleDateString("ru-RU")} · ${esc(o.statusText)}</div></div>
      <div style="display:flex;gap:6px;flex:none"><button class="chip" data-repeat="${esc(o.id)}">🔁 Повторить</button>${o.canCancel ? `<button class="chip" data-cancel="${esc(o.id)}" style="color:var(--rose)">Отменить</button>` : ""}</div></div>`).join("")
      : `<div class="muted" style="padding:14px 0;font-size:14px">Заказов пока нет</div>`;
    box.querySelectorAll("[data-repeat]").forEach((b) => (b.onclick = () => {
      const o = d.items.find((x) => x.id === b.dataset.repeat); if (!o) return;
      let added = 0, miss = 0;
      for (const it of o.items || []) {
        const p = byId(it.id);
        if (!p || !p.inStock) { miss++; continue; }
        const size = p.sizes.includes(it.size) ? it.size : (p.sizes.length === 1 ? p.sizes[0] : "");
        const c = Number.isInteger(it.c) && colorOpt(p, it.c) ? it.c : -1;
        const ex = S.cart.find((x) => x.id === it.id && x.size === size && cc(x) === c);
        if (ex) ex.qty += it.qty; else S.cart.push({ id: it.id, size, c, qty: it.qty });
        added++;
      }
      saveCart(); ev("repeat", null, o.id, added);
      if (!added) { haptic("err"); return toast("Этих товаров сейчас нет в наличии"); }
      haptic("ok"); tab("cart");
      toast(miss ? `Добавлено ${added} поз. · ${miss} нет в наличии` : `Заказ №${o.id} добавлен в корзину`);
    }));
    box.querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = () => {
      const doIt = async (ok) => { if (!ok) return;
        const r2 = await fetch("/api/orders/cancel", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.cancel, initData: tg.initData }) });
        const d2 = await r2.json().catch(() => ({}));
        if (r2.ok) { haptic("ok"); toast("Заказ отменён"); } else { haptic("err"); toast(d2.error || "Не получилось"); }
        loadMyOrders(); };
      if (tg && tg.showConfirm) tg.showConfirm(`Отменить заказ №${b.dataset.cancel}?`, doIt); else doIt(confirm("Отменить заказ?"));
    }));
  } catch (e) { box.innerHTML = `<div class="muted" style="padding:14px 0;font-size:14px">Не удалось загрузить заказы</div>`; }
}

async function load(reload) {
  if (reload) { const r = await fetch("/api/catalog", { cache: "no-store" }); S.data = await r.json(); return; }
  try {
    const r = await fetch("/api/catalog", { cache: "no-store" });
    S.data = await r.json();
    fetch("/api/top", { cache: "no-store" }).then((r) => r.json()).then((t) => { S.top = t; const b = $("#topbox"); if (b) b.innerHTML = topHTML(); }).catch(() => {});
    saveCart();
    if (!S.stack.length) S.stack = [{ name: S.country ? "home" : "country", params: {} }];
    // ?p=<id> — открыть товар по ссылке
    const pid = new URLSearchParams(location.search).get("p") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
    if (pid && byId(pid) && S.stack.length === 1) { S.stack.push({ name: "product", params: { id: pid } }); ev("view", pid); }
    render();
    ev("open");
    if (tg && tg.initData) adminPost("/api/admin/me", {}).then((d) => { if (d.admin) { S.admin = true; if (S.stack[S.stack.length - 1].name === "product") render(); } }).catch(() => {});
    if (tg && tg.initData) fetch("/api/hello", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) }).catch(() => {});
  } catch (e) {
    app.innerHTML = `<div class="empty"><b>Нет связи</b>Проверьте интернет и откройте каталог ещё раз</div>`;
  }
}
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#160507"); tg.setBackgroundColor("#160507"); tg.setBottomBarColor && tg.setBottomBarColor("#160507"); } catch (e) {} }
load();
